name: WiKids 크롤링 및 GitHub Pages 배포

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 매일 한국시간 08:30 (UTC 23:30) 및 18:30 (UTC 09:30) 자동 수집 및 배포
    - cron: "30 23 * * *"
    - cron: "30 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Run crawlers and export static JSON
        working-directory: backend
        run: python export_static.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static Next.js site
        working-directory: frontend
        env:
          NEXT_PUBLIC_STATIC_MODE: "true"
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
        run: |
          npm run build
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
